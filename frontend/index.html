<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SEO Agent v2</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap');
:root{--bg:#0c0f14;--card:#161b24;--border:#1e2533;--accent:#4f8cff;--green:#2dd4a0;--orange:#f59e42;--red:#ff6b6b;--text:#e2e8f0;--muted:#7a8599;--dim:#3a4558}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'JetBrains Mono',monospace;background:var(--bg);color:var(--text);padding:20px 16px}
.w{max-width:960px;margin:0 auto}
h1{font-size:18px;font-weight:700}
.sub{font-size:10px;color:var(--muted)}
.hdr{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.tabs{display:flex;gap:6px;margin-bottom:16px}
.tab{padding:6px 14px;font-size:11px;font-family:inherit;border:1px solid transparent;border-radius:6px;cursor:pointer;background:0;color:var(--muted)}
.tab.a{color:var(--accent);background:rgba(79,140,255,.1);border-color:rgba(79,140,255,.25);font-weight:700}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.stat{flex:1;min-width:120px;text-align:center}
.stat .v{font-size:22px;font-weight:700;color:var(--accent)}
.stat .l{font-size:10px;color:var(--muted);margin-top:2px}
.src{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.src:last-child{border:0}
.src-name{font-size:11px;font-weight:600}
.src-info{font-size:10px;color:var(--muted)}
.src-fresh{font-size:9px;padding:2px 6px;border-radius:10px}
.tag-chip{display:inline-flex;align-items:center;gap:3px;font-size:10px;padding:2px 8px;border-radius:12px;background:rgba(79,140,255,.08);border:1px solid rgba(79,140,255,.18);color:var(--accent);cursor:pointer;margin:2px}
.tag-chip.active{background:rgba(79,140,255,.2);border-color:var(--accent)}
.tag-chip .cnt{font-size:9px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:11px}
th{text-align:left;padding:8px 6px;color:var(--muted);border-bottom:1px solid var(--border);cursor:pointer;font-weight:600;font-size:10px}
td{padding:6px;border-bottom:1px solid rgba(30,37,51,.5)}
tr:hover{background:rgba(79,140,255,.04)}
.q{color:var(--text);max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.u{color:var(--accent);font-size:9px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{padding:8px 16px;border-radius:7px;border:0;font-size:11px;font-weight:600;font-family:inherit;cursor:pointer;color:#fff;background:var(--accent)}
.btn-sm{padding:4px 10px;font-size:10px}
.btn-outline{background:0;border:1px solid var(--accent);color:var(--accent)}
select,input[type=file]{padding:6px 10px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:11px;font-family:inherit}
select:focus,input:focus{outline:0;border-color:var(--accent)}
.upload-zone{border:2px dashed var(--border);border-radius:10px;padding:20px;text-align:center;color:var(--muted);font-size:11px;cursor:pointer;transition:border-color .2s}
.upload-zone:hover{border-color:var(--accent)}
.upload-zone input{display:none}
.pager{display:flex;gap:8px;justify-content:center;margin-top:12px;align-items:center;font-size:11px;color:var(--muted)}
.empty{color:var(--muted);font-size:12px;padding:30px;text-align:center}
.ft{margin-top:24px;padding-top:12px;border-top:1px solid var(--border);font-size:9px;color:var(--dim);text-align:center}
</style>
</head>
<body>
<div class="w">
<div class="hdr"><span style="font-size:26px">🤖</span><div><h1>SEO Agent v2</h1><div class="sub">данные → теги → ядро → аудит</div></div></div>

<div class="tabs">
<button class="tab a" onclick="go('dash')">📊 Дашборд</button>
<button class="tab" onclick="go('queries')">🔍 Запросы</button>
<button class="tab" onclick="go('cannibal')">⚔️ Каннибализация</button>
<button class="tab" onclick="go('upload')">📂 Загрузка</button>
</div>

<div id="p-dash"></div>
<div id="p-queries" style="display:none"></div>
<div id="p-cannibal" style="display:none"></div>
<div id="p-upload" style="display:none"></div>

<div class="ft">SEO Agent v2 · DuckDB · данные → теги → ядро → аудит</div>
</div>

<script>
const A='';
let curTag=null, curPage=0;

function go(t){
  document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('a',['dash','queries','cannibal','upload'][i]===t));
  ['dash','queries','cannibal','upload'].forEach(p=>document.getElementById('p-'+p).style.display=p===t?'block':'none');
  if(t==='dash')loadDash();
  if(t==='queries'){curPage=0;loadQueries();}
  if(t==='cannibal')loadCannibal();
}

// ── Dashboard ──
async function loadDash(){
  const el=document.getElementById('p-dash');
  el.innerHTML=`<div class="empty">⟳ Загружаю...</div>`;
  let d;
  try{
    const r=await fetch(A+'/api/dashboard');
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    d=await r.json();
  }catch(e){
    el.innerHTML=`<div class="card" style="border-color:var(--red)"><div style="color:var(--red);font-weight:600;margin-bottom:4px">⚠️ Ошибка загрузки дашборда</div><div style="font-size:11px;color:var(--muted)">${e.message}</div></div>`;
    return;
  }

  const srcNames={gsc:'Google Search Console',webmaster:'Яндекс.Вебмастер',metrika:'Яндекс.Метрика',topvisor:'TopVisor',direct:'Яндекс.Директ'};
  const srcHTML=(d.sources||[]).map(s=>{
    const ts=s.last_update&&s.last_update!=='None'?new Date(s.last_update):null;
    const age=ts?Math.round((Date.now()-ts)/86400000):null;
    const fresh=age===null?'color:var(--muted)':age<=7?'color:var(--green)':age<=14?'color:var(--orange)':'color:var(--red)';
    const ageStr=age===null?'неизвестно':age===0?'сегодня':age+' дн. назад';
    return `<div class="src"><div><div class="src-name">${srcNames[s.source]||s.source}</div><div class="src-info">${(s.rows||0).toLocaleString()} записей</div></div><span class="src-fresh" style="${fresh}">${ageStr}</span></div>`;
  }).join('');

  const tagHTML=(d.tags||[]).map(t=>`<span class="tag-chip" onclick="go('queries');curTag='${t.id}';loadQueries()">${t.icon} ${t.name} <span class="cnt">${t.count}</span></span>`).join('');
  const topHTML=(d.top_queries||[]).map(q=>`<tr><td class="q">${q.query}</td><td>${q.clicks}</td><td>${q.position}</td></tr>`).join('');
  const allZero=d.tags&&d.tags.length>0&&d.tags.every(t=>t.count===0);

  el.innerHTML=`
    ${allZero?`<div class="card" style="border-color:var(--orange);background:rgba(245,158,66,.06);margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div><div style="font-size:12px;font-weight:600;color:var(--orange)">⚠️ Теги не рассчитаны</div>
        <div style="font-size:11px;color:var(--muted);margin-top:2px">Импорт мог ещё не завершиться, или требуется пересчёт</div></div>
        <button class="btn btn-sm btn-outline" onclick="recomputeTags(this)">↻ Пересчитать</button>
      </div></div>`:''}
    <div class="row" style="margin-bottom:12px">
      <div class="card stat"><div class="v">${(d.total_queries||0).toLocaleString()}</div><div class="l">запросов</div></div>
      <div class="card stat"><div class="v">${(d.total_pages||0).toLocaleString()}</div><div class="l">страниц</div></div>
      <div class="card stat"><div class="v">${(d.sources||[]).length}</div><div class="l">источников</div></div>
    </div>
    <div class="card"><div style="font-size:12px;font-weight:600;margin-bottom:8px">📡 Источники данных</div>${srcHTML||'<div class="empty">Нет данных</div>'}</div>
    <div class="card" id="tags-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div style="font-size:12px;font-weight:600">🏷️ Теги</div>
        <div style="display:flex;gap:6px;align-items:center">
          <span id="import-status-badge"></span>
          <button class="btn btn-sm btn-outline" onclick="recomputeTags(this)">↻ Пересчитать</button>
        </div>
      </div>
      <div>${tagHTML||'<div class="empty">Теги появятся после загрузки данных</div>'}</div>
    </div>
    <div class="card"><div style="font-size:12px;font-weight:600;margin-bottom:8px">🔝 Топ запросов по кликам</div>
      <table><tr><th>Запрос</th><th>Клики</th><th>Позиция</th></tr>${topHTML||'<tr><td colspan=3 class="empty">Нет данных</td></tr>'}</table>
    </div>`;

  // Начинаем поллинг статуса импорта
  startStatusPolling();
}

async function recomputeTags(btn){
  if(btn){btn.disabled=true;btn.textContent='⟳ Считаю...';}
  try{
    const r=await fetch(A+'/api/import/recompute-tags',{method:'POST'});
    const d=await r.json();
    if(btn){btn.textContent=`✓ ${d.tags_computed} тегов`;}
    setTimeout(loadDash,800);
  }catch(e){
    if(btn){btn.disabled=false;btn.textContent='↻ Пересчитать';}
    alert('Ошибка: '+e.message);
  }
}

let _statusPollTimer=null;
async function startStatusPolling(){
  stopStatusPolling();
  await pollStatus();
}
function stopStatusPolling(){
  if(_statusPollTimer){clearTimeout(_statusPollTimer);_statusPollTimer=null;}
}
async function pollStatus(){
  try{
    const s=await(await fetch(A+'/api/status')).json();
    const badge=document.getElementById('import-status-badge');
    if(!badge)return; // вкладка закрыта
    if(s.running){
      const phase={scanning:'сканирую файлы',computing_tags:'считаю теги'}[s.phase]||s.phase||'импорт';
      badge.innerHTML=`<span style="font-size:10px;color:var(--orange)">⟳ ${phase}...</span>`;
      _statusPollTimer=setTimeout(pollStatus,3000);
    }else if(s.phase==='computing_tags'||s.phase==='done'){
      badge.innerHTML=`<span style="font-size:10px;color:var(--green)">✓ готово</span>`;
      // Перезагрузить дашборд чтобы показать свежие каунтеры
      setTimeout(loadDash,1000);
    }else{
      badge.innerHTML='';
    }
  }catch(e){/* тихо игнорируем */}
}

// ── Queries ──
async function loadQueries(){
  const el=document.getElementById('p-queries');
  const limit=50;
  const offset=curPage*limit;
  let url=A+`/api/queries?limit=${limit}&offset=${offset}&sort=clicks&order=desc`;
  if(curTag)url+=`&tag=${curTag}`;

  const[d,tags]=await Promise.all([
    fetch(url).then(r=>r.json()),
    fetch(A+'/api/tags').then(r=>r.json())
  ]);

  const tagBar=tags.map(t=>`<span class="tag-chip ${curTag===t.id?'active':''}" onclick="curTag=curTag==='${t.id}'?null:'${t.id}';curPage=0;loadQueries()">${t.icon} ${t.name} <span class="cnt">${t.query_count}</span></span>`).join('')+
    (curTag?` <span class="tag-chip" onclick="curTag=null;curPage=0;loadQueries()" style="color:var(--red);border-color:var(--red)">✕ сбросить</span>`:'');

  const rows=d.queries.map(q=>{
    const qtags=q.tags.map(t=>`<span style="font-size:9px">${t.icon}</span>`).join(' ');
    return `<tr>
      <td class="q">${q.query}</td>
      <td class="u">${q.url||''}</td>
      <td>${q.clicks}</td><td>${q.shows}</td>
      <td>${q.position}</td><td>${(q.ctr*100).toFixed(1)}%</td>
      <td>${q.demand||''}</td><td>${qtags}</td></tr>`;
  }).join('');

  const totalPages=Math.ceil(d.total/limit);

  el.innerHTML=`
    <div class="card"><div style="margin-bottom:8px">${tagBar}</div></div>
    <div class="card">
      <div style="font-size:11px;color:var(--muted);margin-bottom:8px">Всего: ${d.total.toLocaleString()} запросов${curTag?' (фильтр по тегу)':''}</div>
      <div style="overflow-x:auto">
      <table>
        <tr><th>Запрос</th><th>URL</th><th>Клики</th><th>Показы</th><th>Позиция</th><th>CTR</th><th>Спрос</th><th>Теги</th></tr>
        ${rows||'<tr><td colspan=8 class="empty">Нет данных</td></tr>'}
      </table></div>
      <div class="pager">
        ${curPage>0?`<button class="btn btn-sm btn-outline" onclick="curPage--;loadQueries()">← Назад</button>`:''}
        <span>стр. ${curPage+1} из ${totalPages||1}</span>
        ${curPage<totalPages-1?`<button class="btn btn-sm btn-outline" onclick="curPage++;loadQueries()">Далее →</button>`:''}
      </div>
    </div>`;
}

// ── Cannibalization ──
let canniPage=0;
async function loadCannibal(){
  const el=document.getElementById('p-cannibal');
  const limit=50;
  el.innerHTML=`<div class="empty">⟳ Загружаю...</div>`;
  let d;
  try{
    const r=await fetch(A+`/api/cannibalization?limit=${limit}&offset=${canniPage*limit}`);
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    d=await r.json();
  }catch(e){
    el.innerHTML=`<div class="card" style="border-color:var(--red)"><div style="color:var(--red)">${e.message}</div></div>`;
    return;
  }

  const totalPages=Math.max(1,Math.ceil(d.total/limit));
  const rows=(d.cannibalization||[]).map(c=>{
    const urls=c.urls.map(u=>`<div style="display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--border)"><span class="u" style="max-width:400px">${u.url}</span><span style="font-size:10px;color:var(--muted)">клики: ${u.clicks} · поз: ${u.position}</span></div>`).join('');
    return `<div class="card"><div style="font-size:12px;font-weight:600;margin-bottom:6px;display:flex;justify-content:space-between"><span>⚔️ «${c.query}» <span style="color:var(--red);font-size:10px">${c.url_count} URL</span></span><span style="font-size:10px;color:var(--muted);font-weight:400">Σ ${c.total_clicks} кликов</span></div>${urls}</div>`;
  }).join('');

  const pager=d.total>limit?`<div class="pager">
    ${canniPage>0?`<button class="btn btn-sm btn-outline" onclick="canniPage--;loadCannibal()">← Назад</button>`:''}
    <span>стр. ${canniPage+1} из ${totalPages} (${canniPage*limit+1}–${Math.min((canniPage+1)*limit,d.total)} из ${d.total.toLocaleString()})</span>
    ${canniPage<totalPages-1?`<button class="btn btn-sm btn-outline" onclick="canniPage++;loadCannibal()">Далее →</button>`:''}
  </div>`:'';

  el.innerHTML=`<div style="font-size:11px;color:var(--muted);margin-bottom:12px">Запросы, по которым ранжируются 2+ страницы — всего: <b>${d.total.toLocaleString()}</b></div>${rows||'<div class="empty">Каннибализация не обнаружена</div>'}${pager}`;
}

// ── Upload ──
function renderUpload(){
  const el=document.getElementById('p-upload');
  el.innerHTML=`
    <div class="card">
      <div style="font-size:12px;font-weight:600;margin-bottom:12px">📂 Загрузка данных</div>
      <div style="font-size:11px;color:var(--muted);margin-bottom:12px">Загружайте CSV/XLSX экспорты из сервисов аналитики. Или добавляйте файлы в папку <code>data/</code> в репозитории и делайте <code>git push</code>.</div>
      <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center">
        <select id="up-src"><option value="gsc">Google Search Console</option><option value="webmaster">Яндекс.Вебмастер</option><option value="metrika">Яндекс.Метрика</option><option value="topvisor">TopVisor</option><option value="direct">Яндекс.Директ</option></select>
        <select id="up-reg"><option value="russia">🇷🇺 Россия</option><option value="moscow">📍 Москва и МО</option></select>
        <select id="up-plat"><option value="mobile">📱 Мобильные</option><option value="desktop">🖥 Десктоп</option></select>
      </div>
      <div class="upload-zone" onclick="document.getElementById('up-file').click()">
        <input type="file" id="up-file" accept=".csv,.xlsx,.zip" onchange="doUpload(this.files[0])">
        <div style="font-size:16px;margin-bottom:6px">📎</div>
        Нажмите или перетащите CSV / XLSX / ZIP файл
      </div>
      <div id="up-status" style="margin-top:10px;font-size:11px;display:none"></div>
    </div>
    <div class="card">
      <div style="font-size:12px;font-weight:600;margin-bottom:8px">💡 Как загружать через git</div>
      <div style="font-size:11px;color:var(--muted);line-height:1.8">
        1. Положите файлы в <code>data/{source}/</code> (gsc, webmaster, metrika, topvisor, direct)<br>
        2. <code>git add -A && git commit -m "данные" && git push</code><br>
        3. Railway автоматически передеплоит и импортирует<br>
        Имя файла определяет регион и платформу: <code>moscow</code> → Москва, <code>desktop</code> → десктоп
      </div>
    </div>`;
}

async function doUpload(file){
  if(!file)return;
  const st=document.getElementById('up-status');
  st.style.display='block';
  st.style.color='var(--accent)';
  st.textContent='⟳ Загружаю и обрабатываю...';
  const form=new FormData();
  form.append('file',file);
  form.append('source',document.getElementById('up-src').value);
  form.append('region',document.getElementById('up-reg').value);
  form.append('platform',document.getElementById('up-plat').value);
  try{
    const r=await fetch(A+'/api/import/upload',{method:'POST',body:form});
    const d=await r.json();
    if(!r.ok)throw new Error(d.detail||'Error');
    st.style.color='var(--green)';
    st.textContent=`✅ Импортировано: ${JSON.stringify(d)}`;
  }catch(e){st.style.color='var(--red)';st.textContent='❌ '+e.message;}
}

// init
renderUpload();
loadDash();
</script>
</body>
</html>
